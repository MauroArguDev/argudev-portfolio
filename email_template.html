<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New message — ArguDev</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');
  </style>
</head>
<body style="margin:0;padding:0;background-color:#0A0A0F;-webkit-font-smoothing:antialiased;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0"
    style="background-color:#0A0A0F;padding:48px 20px;">
    <tr>
      <td align="center">

        <!-- Inner container -->
        <table width="600" cellpadding="0" cellspacing="0" border="0"
          style="max-width:600px;width:100%;">

          <!-- ── WORDMARK ── -->
          <tr>
            <td style="padding:0 0 36px 0;">
              <span style="font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:30px;letter-spacing:-1px;color:#F5F5F7;line-height:1;">Argu</span><span style="font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:30px;letter-spacing:-1px;color:#B026FF;line-height:1;">Dev</span><span style="font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:30px;letter-spacing:-1px;color:#FF0844;line-height:1;">.</span>
            </td>
          </tr>

          <!-- ── CARD ── -->
          <tr>
            <td style="background-color:#15151F;border:1px solid rgba(255,255,255,0.10);border-top-color:rgba(255,255,255,0.22);border-radius:20px;padding:36px;">

              <!-- Eyebrow -->
              <p style="font-family:'JetBrains Mono',Consolas,monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#5C5C6B;margin:0 0 24px 0;">
                New message · argudev.com
              </p>

              <!-- Sender name -->
              <h1 style="font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.5px;color:#F5F5F7;margin:0 0 6px 0;">
                {{from_name}}
              </h1>

              <!-- Sender email -->
              <p style="font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#B026FF;margin:0 0 32px 0;">
                {{from_email}}
              </p>

              <!-- Divider -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0"
                style="margin:0 0 32px 0;">
                <tr>
                  <td style="height:1px;background-color:#1F1F2E;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>

              <!-- Message label -->
              <p style="font-family:'JetBrains Mono',Consolas,monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#5C5C6B;margin:0 0 14px 0;">
                Message
              </p>

              <!-- Message body -->
              <p style="font-family:'DM Sans',Arial,sans-serif;font-size:15px;line-height:1.75;color:#A1A1AA;margin:0;white-space:pre-wrap;">{{message}}</p>

            </td>
          </tr>

          <!-- ── REPLY CTA ── -->
          <tr>
            <td style="padding:28px 0;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#B026FF;border-radius:12px;box-shadow:0 0 24px rgba(176,38,255,0.35);">
                    <a href="mailto:{{from_email}}"
                      style="display:inline-block;font-family:'DM Sans',Arial,sans-serif;font-weight:500;font-size:14px;color:#F5F5F7;text-decoration:none;padding:12px 28px;letter-spacing:0.2px;">
                      Reply to {{from_name}} →
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── FOOTER ── -->
          <tr>
            <td style="padding-top:8px;border-top:1px solid #1F1F2E;">
              <p style="font-family:'JetBrains Mono',Consolas,monospace;font-size:10px;color:#5C5C6B;letter-spacing:1px;margin:16px 0 0 0;">
                ArguDev · argudev.com · 2026
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
