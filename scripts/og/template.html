<!doctype html>
<!-- Open Graph image for a blog post, 1200×630. Filled in and rendered by scripts/og.ts. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  {{fonts}}

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0A0A0F;
    color: #F5F5F7;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  /* The site's backdrop: a faint 72px grid fading out from the top */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgb(255 255 255 / 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.05) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 90% 90% at 70% 10%, #000 30%, transparent 85%);
  }

  /* The single violet light, behind the mark */
  .light {
    position: absolute;
    width: 820px;
    height: 820px;
    right: -260px;
    top: -170px;
    background: radial-gradient(closest-side, rgb(176 38 255 / 0.34), rgb(93 26 158 / 0.14) 55%, transparent);
  }

  .mark {
    position: absolute;
    right: 72px;
    top: 112px;
    width: 300px;
    color: #F5F5F7;
  }

  /* The mark's open top corners, framing the whole card */
  .brackets::before,
  .brackets::after {
    content: "";
    position: absolute;
    top: 40px;
    width: 44px;
    height: 44px;
    border-top: 2px solid #F5F5F7;
  }
  .brackets::before { left: 40px; border-left: 2px solid #F5F5F7; }
  .brackets::after { right: 40px; border-right: 2px solid #F5F5F7; }

  .content {
    position: absolute;
    left: 80px;
    top: 84px;
    bottom: 76px;
    width: 700px;
    display: flex;
    flex-direction: column;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #A1A1AA;
  }

  .wordmark {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.03em;
    text-transform: none;
  }
  .wordmark .dev { color: #B026FF; }
  .wordmark .dot { color: #FF0844; }

  .rule { width: 40px; height: 1px; background: rgb(255 255 255 / 0.3); }

  h1 {
    margin-top: auto;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 66px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }

  .nowrap { white-space: nowrap; }

  .meta {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #A1A1AA;
  }
  .meta .accent { width: 40px; height: 2px; background: #B026FF; }

  .url {
    position: absolute;
    right: 80px;
    bottom: 76px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.06em;
    color: #F5F5F7;
  }
</style>
</head>
<body>
  <div class="canvas brackets">
    <div class="grid"></div>
    <div class="light"></div>
    <div class="mark">{{logo}}</div>

    <div class="content">
      <p class="eyebrow">
        <span class="wordmark">Argu<span class="dev">Dev</span><span class="dot">.</span></span>
        <span class="rule"></span>
        Blog
      </p>
      <h1>{{title}}</h1>
      <p class="meta"><span class="accent"></span>{{meta}}</p>
    </div>

    <p class="url">argudev.com/blog</p>
  </div>
</body>
</html>
